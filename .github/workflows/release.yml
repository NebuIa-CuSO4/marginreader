name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 0.2.8

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Markdown math regression tests
        run: npm run test:math

      - name: Build application
        run: npm run build

      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installer to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version: $version" }
          $installer = "release/Margin-$version-Setup.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          $tag = "v$version"
          gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE) {
            gh release create $tag $installer --verify-tag --title "Margin $version" --generate-notes
          } else {
            gh release upload $tag $installer --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --draft=false
          }
          exit $LASTEXITCODE
