<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选择屏幕区域</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        cursor: crosshair;
        user-select: none;
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
      }
      #box {
        position: fixed;
        display: none;
        border: 1.5px solid #79c7bd;
        border-radius: 4px;
        background: transparent;
        box-shadow: 0 0 0 100vmax rgba(6, 10, 14, 0.44);
        z-index: 2;
      }
      #hint {
        position: fixed;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        padding: 9px 14px;
        border-radius: 999px;
        color: #f4f1e8;
        background: rgba(16, 22, 26, 0.9);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 13px;
        letter-spacing: 0.01em;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.28);
        z-index: 3;
        pointer-events: none;
        white-space: nowrap;
      }
      #hint span { color: #8fd3c9; }
      #vh, #hh {
        position: fixed;
        display: none;
        background: rgba(121, 199, 189, 0.65);
        z-index: 1;
        pointer-events: none;
      }
      #vh { width: 1px; top: 0; bottom: 0; }
      #hh { height: 1px; left: 0; right: 0; }
    </style>
  </head>
  <body>
    <div id="hint">拖动选择要截取的区域 · <span>Esc 取消</span></div>
    <div id="vh"></div>
    <div id="hh"></div>
    <div id="box"></div>
    <script>
      const box = document.getElementById('box')
      const hint = document.getElementById('hint')
      const vh = document.getElementById('vh')
      const hh = document.getElementById('hh')
      let start = null
      let dragging = false

      function point(event) {
        return {
          x: Math.max(0, Math.min(window.innerWidth, event.clientX)),
          y: Math.max(0, Math.min(window.innerHeight, event.clientY))
        }
      }

      function draw(current) {
        if (!start) return
        const x = Math.min(start.x, current.x)
        const y = Math.min(start.y, current.y)
        const width = Math.abs(current.x - start.x)
        const height = Math.abs(current.y - start.y)
        box.style.display = 'block'
        box.style.left = x + 'px'
        box.style.top = y + 'px'
        box.style.width = width + 'px'
        box.style.height = height + 'px'
        vh.style.display = 'block'
        hh.style.display = 'block'
        vh.style.left = current.x + 'px'
        hh.style.top = current.y + 'px'
      }

      window.addEventListener('mousedown', (event) => {
        if (event.button !== 0) return
        start = point(event)
        dragging = true
        hint.style.display = 'none'
        draw(start)
      })

      window.addEventListener('mousemove', (event) => {
        if (!dragging || !start) return
        draw(point(event))
      })

      window.addEventListener('mouseup', (event) => {
        if (!dragging || !start) return
        dragging = false
        const current = point(event)
        const x = Math.min(start.x, current.x)
        const y = Math.min(start.y, current.y)
        const width = Math.abs(current.x - start.x)
        const height = Math.abs(current.y - start.y)
        if (width < 6 || height < 6) {
          window.overlayApi.cancel()
          return
        }
        window.overlayApi.commit({ x, y, width, height })
      })

      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.overlayApi.cancel()
      })

      window.overlayApi.ready()
    </script>
  </body>
</html>
