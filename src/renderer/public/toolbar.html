<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>划词操作</title>
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-user-select: none;
        font-family: "Segoe UI Variable", "Microsoft YaHei UI", sans-serif;
      }
      .wrap {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 100%;
        padding: 6px;
        border-radius: 14px;
        background: rgba(18, 24, 28, 0.96);
        border: 1px solid rgba(255, 255, 255, 0.13);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        -webkit-app-region: no-drag;
      }
      .mark {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #0e1518;
        background: #8fd3c9;
        font-size: 13px;
        font-weight: 700;
        margin: 0 2px 0 4px;
        flex: 0 0 auto;
      }
      button {
        appearance: none;
        border: 0;
        height: 34px;
        padding: 0 11px;
        border-radius: 9px;
        color: #ece9df;
        background: transparent;
        font-size: 12.5px;
        font-family: inherit;
        cursor: pointer;
        white-space: nowrap;
        transition: background 120ms ease, color 120ms ease;
      }
      button:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
      button:active { background: rgba(143, 211, 201, 0.2); }
      button.primary { color: #a8e4db; }
      .close {
        width: 28px;
        padding: 0;
        color: #8b969b;
        font-size: 16px;
      }
      .sep { width: 1px; height: 22px; background: rgba(255, 255, 255, 0.12); margin: 0 2px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">M</div>
      <button class="primary" data-action="translate">翻译</button>
      <button data-action="explain">解释</button>
      <div class="sep"></div>
      <button data-action="save">存生词</button>
      <button class="close" id="close" title="关闭">×</button>
    </div>
    <script>
      document.querySelectorAll('button[data-action]').forEach((button) => {
        button.addEventListener('click', () => {
          window.toolbarApi.action(button.dataset.action)
        })
      })
      document.getElementById('close').addEventListener('click', () => window.toolbarApi.close())
      window.addEventListener('keydown', (event) => {
        if (event.key === 'Escape') window.toolbarApi.close()
      })
      window.addEventListener('blur', () => window.toolbarApi.close())
    </script>
  </body>
</html>
